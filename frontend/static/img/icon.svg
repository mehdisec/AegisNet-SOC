<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Shape -->
  <rect width="512" height="512" rx="100" fill="#030712" />

  <!-- Outer Cyber Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#1e293b" stroke-width="3" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#0e7490" stroke-width="1.5" opacity="0.4" />

  <!-- Outer Glowing Shield -->
  <path d="M 256 60 L 400 120 C 400 280 256 420 256 420 C 256 420 112 280 112 120 Z" 
        fill="none" stroke="url(#neonBorder)" stroke-width="14" filter="url(#glow)" stroke-linejoin="round" />

  <!-- Shield Body -->
  <path d="M 256 75 L 385 129 C 385 272 256 398 256 398 C 256 398 127 272 127 129 Z" 
        fill="url(#shieldGrad)" stroke="#0891b2" stroke-width="4" stroke-linejoin="round" />

  <!-- Radar Grid Circles Inside Shield -->
  <circle cx="256" cy="235" r="95" fill="none" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />
  <circle cx="256" cy="235" r="65" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.8" />
  <circle cx="256" cy="235" r="35" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.9" />

  <!-- Radar Crosshairs -->
  <line x1="256" y1="125" x2="256" y2="345" stroke="#22d3ee" stroke-width="2.5" opacity="0.75" />
  <line x1="145" y1="235" x2="367" y2="235" stroke="#22d3ee" stroke-width="2.5" opacity="0.75" />

  <!-- Radar Sweep Arm Arc -->
  <path d="M 256 235 L 322 170 A 92 92 0 0 0 256 143 Z" fill="url(#coreGlow)" opacity="0.35" />

  <!-- Central Defense Core Node -->
  <circle cx="256" cy="235" r="10" fill="#22d3ee" filter="url(#glow)" />
  <circle cx="256" cy="235" r="4" fill="#ffffff" />

  <!-- Cyber Blips (Threats & Active Sockets) -->
  <circle cx="210" cy="190" r="5" fill="#38bdf8" />
  <circle cx="310" cy="215" r="5" fill="#10b981" />
  <circle cx="280" cy="290" r="6" fill="#f43f5e" filter="url(#glow)" />
  <circle cx="190" cy="265" r="4.5" fill="#a855f7" />

  <!-- Bottom Tech Bracket Accent -->
  <path d="M 190 440 L 256 470 L 322 440" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" />
</svg>
